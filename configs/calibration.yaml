# ↓↓↓ 当前实机在用（USB 实测 SN=FDN21050087, MER2-160-227U3C）
# camera_name 支持 "auto": 程序自己枚举, 先找海康再找大恒。
# 队里两种相机混用, 忘改这里的表现是"找不到相机", 排查成本高于它的价值。
# 需要强制指定时写 "hikrobot" 或 "daheng"。
camera_name: "auto"

# camera_sn 留空 = 用探测到的那台。只有一台相机时不必填;
# 填错会让 hikrobot 的 ChoiceCamrea / daheng 的 enum_and_check_camera 匹配不上。
camera_sn: ""
# 2026-09-04 实机调参（camera_tuning 实测）：
#   对焦 sharp 6 -> 114（峰值 351）；压曝光后超阈值(150)占比 7.79% -> 0.53%，
#   即 detector 二值化后几乎全黑，无环境假灯条。亮度 44 —— 自瞄要的就是暗。
#   增益暂时拉满(24dB)是因为室内桌面调、手上没有通电装甲板；
#   等有真装甲板后应能降回 0.4~0.5（对齐 demo.yaml / sb_long.yaml），降低噪点。
exposure_us: 2000
gain: 1.0
gamma: 0.7
img_gamma: 1
vid_pid: "2ba2:4d55"
flip: true
mirror: true

