# ============================================================================
#  实机识别测试配置 / live detection config
# ----------------------------------------------------------------------------
#  给 build/detect_test 用：接相机实时跑装甲板识别、识别到画框。
#
#  为什么单独一份，不复用现有的两个：
#    · configs/calibration.yaml  是标定专用，只有相机参数和标定矩阵，
#      没有 yolo_name / threshold / min_confidence 这些识别参数。
#      直接拿它跑识别会在 YAML 转换时抛 TypedBadConversion 崩掉。
#    · configs/demo.yaml         有完整识别参数，但相机段是另一台机器
#      (SN FDN24040486)，在本机跑会找不到相机。
#  所以本文件 = demo.yaml 的识别参数 + calibration.yaml 的实机相机参数。
#
#  相机参数已同步为实测值（SN FDN21050087）。改了 calibration.yaml 里的
#  曝光/增益后，记得也同步到这里，否则两个程序看到的画面不一样。
#
#  ⚠️ camera_matrix / distort_coeffs 只在 3D 解算时才用到。detect_test
#     不做解算（那需要 C 板提供云台姿态），这两项此处仅作留档。
# ============================================================================

# enemy_color: "red"
enemy_color: "blue"

#####-----神经网络参数-----#####
yolo_name: yolov8
classify_model: ../assets/tiny_resnet.onnx
yolo11_model_path: ../assets/yolo11.xml
yolov8_model_path: ../assets/yolov8.xml
yolov5_model_path: ../assets/yolov5.xml
device: CPU
min_confidence: 0.8
use_traditional: true

#####-----ROI-----#####
roi: 
  x: 420
  y: 250
  width: 600
  height: 600

use_roi: false
# use_roi: true
#####-----传统方法参数-----#####
threshold: 150
max_angle_error: 45 # degree
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25 # degree
min_confidence: 0.8

#####-----tracker参数-----#####
min_detect_count: 5
max_temp_lost_count: 11
outpost_max_temp_lost_count: 75

#####-----aimer参数-----#####
yaw_offset: -0.5 # degree -2.5
pitch_offset: 2 # degree 2
comming_angle: 60 # degree
leaving_angle: 20 # degree
decision_speed: 8 # rad/s
high_speed_delay_time: 0.030 # s
low_speed_delay_time: 0.015 # s
far_pitch_offset: 1.2

#####-----shooter参数-----#####
first_tolerance: 3 # 近距离射击容差，degree
second_tolerance: 2 # 远距离射击容差，degree
judge_distance: 2 #距离判断阈值
auto_fire: true # 是否由自瞄控制射击

# camera_name: "hikrobot"
# exposure_us: 2000
# gain: 16
# vid_pid: "2bdf:0001"
# flip: false
# mirror: false

# camera_name 支持 "auto": 程序自己枚举, 先找海康再找大恒, 找到哪个用哪个。
# 这样换相机不用改配置 —— 队里两种相机混用, 忘改 camera_name 的表现是
# "找不到相机", 排查起来比它值得的时间长得多。
# 需要强制指定时把 auto 换成 "hikrobot" 或 "daheng" 即可。
camera_name: "auto"

# camera_sn 留空表示"用探测到的那台"。只有一台相机时不必填;
# 填错反而会让 hikrobot.cpp 的 ChoiceCamrea / daheng 的 enum_and_check_camera 匹配不上。
camera_sn: ""

# 曝光/增益。注意两家的 gain 口径不同, 都是 0~1 归一化值, 但换算方式不一样:
#   大恒 -> 映射到 dB 量程 (本机 0-24dB)
#   海康 -> 乘以 AutoGainUpperLimit
# 所以同一个数字在两家相机上亮度不同, 换相机后需要重新调。
# 下面这组是海康 MV-CS016-10UC 实测可用值(室内日光灯)。
# 大恒 MER2-160 上车用的是 exposure_us: 3000 / gain: 0.85, 换回大恒时改这两行。
exposure_us: 15000
gain: 0.6
gamma: 0.7
img_gamma: 1
vid_pid: "2ba2:4d55"
# flip / mirror 是"画面转 180 度"的开关，取决于相机在车上怎么装的。
# 两者同时为 true 等价于旋转 180 度（见 io/hikrobot/hikrobot.cpp 的两次 cv::flip）。
#
# 这台相机是倒装的，所以要 true —— 判断依据：camera_tuning 不读这两个参数，
# 它显示的是相机原始画面，实测是倒的。
#
# ⚠️ 必须成对改。只改一个是"镜像"而不是"转 180 度"，
#    那会让装甲板上的数字左右颠倒，数字分类器直接认错 ——
#    这种错很隐蔽：画面看着是正的，但识别率莫名很低。
#
# 换相机或改安装方向后，用 camera_tuning 按 f 键现场确认：
# 它会显示当前是否翻转，按 p 存盘时也会把 flip/mirror 一起写进结果文件。
flip: true
mirror: true

# -1  0  0
#  0 -1  0
#  0  0  1
# R_gimbal2imubody: [-1, 0, 0, 0, -1, 0, 0, 0, 1]
R_gimbal2imubody: [-1, 0, 0, 0, -1, 0, 0, 0, 1]

# 重投影误差: 0.1164px
camera_matrix: [1737.039655225044, 0, 610.8806746255623, 0, 1737.2743775332876, 484.79049617651157, 0, 0, 1]
distort_coeffs: [-0.04884453537210094, 0.12555422968265023, -0.0012399241853100107, -0.0008682406079784554, 0.008637363052025166]

# 相机同理想情况的偏角: yaw-0.60 pitch-0.35 roll-1.53 degree
# 标定板到世界坐标系原点的水平距离: 3.23 m
# 标定板同竖直摆放时的偏角: yaw37.61 pitch3.23 roll-0.06 degree
R_camera2gimbal: [0.010630568168778162, -0.005789248980673708, 0.9999267351244534, -0.9995886616740502, -0.02669899594545312, 0.010472395532356843, 0.02663641254167717, -0.9996267544497518, -0.006070693137125566]
t_camera2gimbal: [0.115368524404037, -0.047768060813373876, 0.05836069500887165]
#####-----cboard参数-----#####
quaternion_canid: 0x100
bullet_speed_canid: 0x101
send_canid: 0xff
can_interface: "can0"

#####-----gimbal参数-----#####
com_port: "/dev/ttyACM0"
# 陀螺仪是否装错, 编号012分别代表电控坐标系ypr，想换旋转轴只需要对编号进行互换即可，负号就是对当前值取负，交换完再取负
# 上车前记得对齐电控坐标系和济瞄惯性系
gimbal_y1: 1
gimbal_p2: -3
gimbal_r3: -2
# 济瞄的惯性系  z轴往上, x轴是枪管指向
#     x  z
#      \ |
#       \|
# y_ _ _ 0   z:yaw   x:roll   y:pitch


#####-----planner-----#####
target_dist_error: -0.23
target_h_error: 0.28
fire_thresh: 0.003
small_armor_tolerance: 0.12
big_armor_tolerance: 0.22
tower_and_base_armor_tolerance_: 0.10  # 26赛季前哨站和基地装甲板检测宽度
gimbal_control_delay: 0.08
tower_pitch_prediction_time: 0.05

max_yaw_acc: 50
Q_yaw: [9e6, 0]
R_yaw: [1]

max_pitch_acc: 100
Q_pitch: [9e6,0]
R_pitch: [1]